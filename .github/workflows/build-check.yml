name: Build Check

on:
  push:
    branches: [ v101-check ]

jobs:
  compile-debug-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: compileDebugKotlin
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon 2>&1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-kotlin-logs
          path: |
            app/build/reports/
            app/build/outputs/
          if-no-files-found: warn

  assemble-debug:
    needs: compile-debug-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-logs
          path: app/build/reports/
          if-no-files-found: warn